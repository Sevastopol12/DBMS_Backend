[project]
name = "dbms-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=23.1.0",
    "asyncpg>=0.31.0",
    "boto3>=1.43.56",
    "celery>=5.6.3",
    "celery-redbeat>=2.4.2", # Redis-backed beat scheduler for multiple replicas.
    "fastapi[standard]>=0.141.1",
    "flower>=2.2.0",
    "fsspec>=2026.7.0",
    "gevent>=26.8.0",
    "ipykernel<7",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "PyJWT>=2.8.0",
    "rapidfuzz>=3.14.5",
    "redbeat>=0.0.1",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "ruff>=0.16.9",
    "s3fs>=2026.7.0",
    "sqlalchemy>=2.0.52",
    "unidecode>=1.4.0",
    "uvicorn>=0.52.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "strict"
markers = [
    "integration: needs Postgres/Redis via TEST_APPLICATION_RDB_URL/TEST_STAGING_RDB_URL/TEST_REDIS_URL",
    "slow: long-running tests",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.ruff]
extend-exclude = ["docs", ".uv-cache", ".venv"]
